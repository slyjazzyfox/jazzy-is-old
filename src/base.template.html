<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="@rel(favicon.png)">
  <link rel="alternate" type="application/rss+xml" title="Jazzy Blog" href="@rel(blog.xml)">
  <meta property="og:image" content="https://jazzyhamster.ar/img/logo.gif">
  <meta property="og:title" content="¡La web de Jazzy!">
  <meta property="og:description" content="Web personal de Jazzyhamster_ar, streamer, hamster 3D, músico, programador">
  <meta property="og:url" content="https://jazzyhamster.ar">

  <title>
    @yield title
  </title>
  <link rel="stylesheet" href="@rel(css/main.css)">
  <style>
    html { background-image: url('@rel(img/texture_lt_blue_011.png)'); }
  </style>
</head>
<body>
<header>
  <div class="logo-container centered">
    <img
        src="@rel(img/hamster/look-1.gif)" alt="Jazzy looking at camera surprised"
        style="transform: translateX(25%);"
    >
    <a href="@rel(index.html)" class="logo">
      <img src="@rel(img/logo.gif)" alt="A logo" title="JazzyHamster_Ar"/>
    </a>
    <img
        src="@rel(img/hamster/look-2.gif)" alt="Jazzy looking at camera surprised pointing behind"
        style="transform: translateX(-25%);"
    >
  </div>

  <nav class="top-nav">
  @include common/top-nav.html
  </nav>
</header>

<aside>
  <nav class="sidebar">
    @include common/sidebar.html
  </nav>
</aside>

<main>
  <div class="content">
    @yield content
  </div>

</main>

<footer>
  @include common/footer.html
</footer>
</body>
</html>
